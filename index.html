<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Service System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILO GERAL --- */
        :root {
            --primary: #0056b3; 
            --bg: #eef2f5;
            --card-bg: #ffffff;
            --text: #333;
            --danger: #d32f2f; 
            --warning: #f57f17;
            --success: #2e7d32;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 1600px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        
        .app-card { width: 100%; max-width: 500px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; margin-top: 20px; position: relative;}
        .hidden { display: none !important; }
        
        /* --- HEADER E LOGOS --- */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .hotel-identity { display: flex; align-items: center; gap: 15px; text-align: left; }
        .hotel-logo-header { max-height: 60px; width: auto; object-fit: contain; }
        .btn-logo { height: 30px; vertical-align: middle; margin-right: 10px; }

        /* --- IDIOMAS --- */
        .lang-options { display: flex; gap: 10px; font-size: 0.9rem; }
        .lang-btn { cursor: pointer; font-weight: 700; opacity: 0.3; transition: opacity 0.2s; text-decoration: none; color: #333; }
        .lang-btn:hover, .lang-btn.active { opacity: 1; text-decoration: underline; }
        .color-br.active { color: #000; }
        .color-us.active { color: #0056b3; }
        .color-es.active { color: #e74c3c; }

        /* Botões e Inputs */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-bottom: 12px; transition: 0.2s; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .btn-hotel { background: white; border: 2px solid #ccc; color: #444; }
        .btn-hotel:hover { border-color: var(--primary); color: var(--primary); background: #f8fbff; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #00a8cc); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-sm { padding: 8px 15px; width: auto; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #999; border-radius: 8px; background: #fff; box-sizing: border-box; font-family: inherit; font-size: 1rem; color: #000;}
        .input-row { display: flex; gap: 10px; }
        .input-row input { flex: 1; }

        /* --- KIT PRAIA --- */
        .beach-kit-container { background: #e3f2fd; border: 2px solid #90caf9; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; }
        .checkbox-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; height: 40px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; cursor: pointer; width: 150px; font-weight: bold; color: #333; }
        input[type="checkbox"] { transform: scale(1.3); margin: 0; cursor: pointer; }
        .dynamic-input { flex: 1; margin-bottom: 0 !important; padding: 8px !important; height: 38px; display: none; font-size: 0.9rem !important; border: 2px solid var(--primary); }

        /* --- PÔR DO SOL --- */
        .sunset-container { background: #fff3e0; border: 2px solid #ffb74d; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .sunset-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .price-tag { background: #2ecc71; color: white; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; display: inline-block;}
        .time-info { font-size: 0.9rem; color: #666; margin-bottom: 10px; display: block; }

        /* --- DASHBOARD MASTER (QUADRO KANBAN) --- */
        .dashboard-container { width: 100%; margin-top: 10px; padding: 0 10px; }
        
        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: transparent; font-weight: bold; color: #666; cursor: pointer; font-size: 1.1rem; border-radius: 8px; }
        .tab-btn:hover { background: #e0e0e0; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0,86,179,0.3); }

        .board-grid { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            align-items: start; 
            justify-content: center;
            width: 100%;
        }
        
        .board-column { 
            background: #ffffff; 
            padding: 10px; 
            border-radius: 8px; 
            width: 300px; 
            flex-grow: 1;
            max-width: 350px;
            border-top: 5px solid #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 10px;
            min-height: 150px;
        }
        
        .board-header { 
            font-weight: 900; color: #222; text-transform: uppercase; font-size: 0.85rem; 
            display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #eee;
        }
        
        /* ESTILO DOS CARTÕES (CARDS) - REFORÇADO */
        .ticket-card { 
            display: block !important; /* Força aparecer */
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Sombra mais forte */
            text-align: left; 
            border: 1px solid #ddd;
            margin-bottom: 10px;
            min-height: 100px;
        }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-time { background: #333; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .card-room { font-size: 1.2rem; font-weight: 900; color: #000; background: #e3f2fd; padding: 4px 10px; border-radius: 4px; border: 1px solid #90caf9;}
        
        .card-desc { font-size: 1rem; color: #000; font-weight: 600; line-height: 1.4; display: block; margin-bottom: 10px; }
        .card-obs { font-size: 0.85rem; color: #555; font-style: italic; background: #f5f5f5; padding: 5px; border-radius: 4px; display: block; margin-bottom: 10px; }

        /* STATUS VISUAL */
        /* Pendente (Vermelho) */
        .status-red { border-left: 10px solid var(--danger); background-color: #fff0f0; }
        .btn-start { width: 100%; padding: 10px; background: #fff3e0; border: 1px solid #ffcc80; color: #e65100; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .btn-start:hover { background: #ffe0b2; }

        /* Em Andamento (Amarelo) */
        .status-yellow { border-left: 10px solid var(--warning); background-color: #fffde7; }
        .btn-resolve { width: 100%; padding: 10px; background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .btn-resolve:hover { background: #c8e6c9; }

        /* Resolvido (Verde) */
        .status-green { border-left: 10px solid var(--success); background-color: #e8f5e9; opacity: 0.8; }
        .btn-archive { width: 100%; padding: 10px; background: #424242; border: 1px solid #212121; color: white; font-weight: bold; cursor: pointer; border-radius: 6px; }

        .tag-count { background: #000; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
        
        /* RELATÓRIOS */
        .filters-bar { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid #ddd; }
        .kpi-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: white; padding: 20px; border-radius: 8px; text-align: center; border-bottom: 4px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .kpi-value { font-size: 2rem; font-weight: 800; color: #333; margin: 10px 0; }
        .report-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .report-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .report-table th { text-align: left; padding: 10px; background: #f5f5f5; border-bottom: 2px solid #ddd; }
        .report-table td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="tela-login" class="app-card">
            <div class="header-row">
                <div style="font-size: 2rem;">🏨</div>
                <div class="lang-options">
                    <span onclick="mudarIdioma('pt')" class="lang-btn color-br active">BR</span>
                    <span onclick="mudarIdioma('en')" class="lang-btn color-us">EN</span>
                    <span onclick="mudarIdioma('es')" class="lang-btn color-es">ES</span>
                </div>
            </div>
            <h1 data-key="login_title">Acesso ao Sistema</h1>
            <button onclick="mostrarAreaHospede('Hit Hotel')" class="btn btn-hotel"><img src="logo_hit.png" alt="Hit" class="btn-logo"> <b>Hit Hotel</b></button>
            <button onclick="mostrarAreaHospede('Porto Salvador')" class="btn btn-hotel"><img src="logo_porto.png" alt="Porto" class="btn-logo"> <b>Porto Salvador</b></button>
            <button onclick="mostrarAreaHospede('Porto das Ancoras')" class="btn btn-hotel"><img src="logo_ancoras.png" alt="Ancoras" class="btn-logo"> <b>Porto das Âncoras</b></button>
            <div style="border-top: 1px solid #eee; margin: 20px 0;"></div>
            <p data-key="admin_area">Área Administrativa</p>
            <input type="password" id="senhaInput" placeholder="Senha..." data-ph="pass_placeholder">
            <button onclick="fazerLogin()" class="btn btn-primary" data-key="enter_btn">Entrar</button>
        </div>

        <div id="tela-hospede" class="app-card hidden">
            <div class="header-row">
                <div class="hotel-identity"><img id="logo-hotel-topo" src="" alt="Logo" class="hotel-logo-header"></div>
                <div class="lang-options"><span onclick="mudarIdioma('pt')" class="lang-btn color-br active">BR</span></div>
            </div>
            <p id="subtitulo-hospede" data-key="welcome_msg">Bem-vindo!</p>
            <div class="input-row">
                <input type="text" id="quarto" placeholder="Nº do Quarto *" required>
                <input type="text" id="telefone" placeholder="Telefone">
            </div>
            <select id="tipo" onchange="verificarOpcao()">
                <option value="" disabled selected>Selecione...</option>
                <option value="Recepção">🗣️ Fale com a Recepção</option>
                <option value="Manutenção">🛠️ Manutenção</option>
                <option value="Praia">🏖️ Aluguel Cadeira, Toalha, Cooler</option>
                <option value="Sunset">🥂 Pôr do Sol com Espumante</option>
                <option value="Sugestão">💡 Sugestão / Elogio</option>
                <option value="Reclamação">📢 Reclamação</option>
            </select>
            <div id="area-kit-praia" class="beach-kit-container hidden">
                <strong>Itens:</strong>
                <div class="checkbox-row"><label><input type="checkbox" id="check-cadeira" onchange="toggleInput('check-cadeira','qtd-cadeira')"> Cadeira</label><input type="number" id="qtd-cadeira" class="dynamic-input" placeholder="Qtd"></div>
                <div class="checkbox-row"><label><input type="checkbox" id="check-toalha" onchange="toggleInput('check-toalha','qtd-toalha')"> Toalha</label><input type="number" id="qtd-toalha" class="dynamic-input" placeholder="Qtd"></div>
                <div class="checkbox-row"><label><input type="checkbox" id="check-cooler" onchange="toggleInput('check-cooler','detalhe-cooler')"> Cooler</label><input type="text" id="detalhe-cooler" class="dynamic-input" placeholder="O que deseja?"></div>
            </div>
            <div id="area-sunset" class="sunset-container hidden">
                <img src="img/por do sol.jpg" class="sunset-img">
                <h3>Pôr do Sol</h3><span class="price-tag">R$ 120,00</span>
                <label>Data:</label><input type="date" id="data-sunset">
            </div>
            <textarea id="descricao" rows="4" placeholder="Descreva..."></textarea>
            <button onclick="enviarChamado()" class="btn btn-success">Enviar</button>
            <button id="btn-voltar" onclick="location.reload()" class="btn btn-hotel hidden">Voltar</button>
        </div>

        <div id="tela-admin" class="hidden dashboard-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="titulo-painel" style="margin:0; font-size:1.5rem;">Painel de Controle</h3>
                <button onclick="location.href = window.location.pathname" class="btn btn-sm btn-hotel">Sair</button>
            </div>

            <div class="tabs-container">
                <button class="tab-btn active" onclick="switchTab('board')" id="btn-tab-board">📋 Quadro Operacional</button>
                <button class="tab-btn" onclick="switchTab('reports')" id="btn-tab-reports">📈 Relatórios</button>
            </div>

            <div id="card-filtro" style="background:white; padding:15px; border-radius:8px; margin-bottom:20px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                <label style="font-weight: bold;">🏢 Selecionar Unidade:</label>
                <select id="filtro-master-select" onchange="atualizarDadosGeral()" style="width: 100%; margin-top:5px; border: 2px solid var(--primary);">
                    <option value="TODOS">Todas as Unidades</option>
                    <option value="Hit Hotel">Hit Hotel</option>
                    <option value="Porto Salvador">Porto Salvador</option>
                    <option value="Porto das Ancoras">Porto das Âncoras</option>
                </select>
            </div>

            <div id="view-board" class="board-grid">
                <p style="width:100%; text-align:center;">Carregando chamados...</p>
            </div>

            <div id="view-reports" class="hidden" style="width: 100%;">
                <div class="filters-bar">
                    <div><label>De:</label><input type="date" id="rel-inicio" style="margin:0; width:150px;"></div>
                    <div><label>Até:</label><input type="date" id="rel-fim" style="margin:0; width:150px;"></div>
                    <button onclick="gerarRelatorios()" class="btn btn-primary" style="width:auto; padding: 10px 20px;">🔍 Filtrar</button>
                </div>
                <div class="kpi-wrapper">
                    <div class="kpi-card" style="border-color:var(--success)"><div class="kpi-title">Resolvidos</div><div class="kpi-value" id="kpi-resolvidos">0</div></div>
                    <div class="kpi-card" style="border-color:var(--danger)"><div class="kpi-title">Pendentes</div><div class="kpi-value" id="kpi-pendentes">0</div></div>
                    <div class="kpi-card" style="border-color:#0288d1"><div class="kpi-title">Tempo Médio</div><div class="kpi-value" id="kpi-tempo">--</div></div>
                    <div class="kpi-card" style="border-color:#f57f17"><div class="kpi-title">Ponto Crítico</div><div class="kpi-value" id="kpi-critico" style="font-size:1.2rem; margin-top:20px;">--</div></div>
                </div>
                <div class="report-section">
                    <h4>📊 Demandas por Categoria</h4>
                    <table class="report-table" id="table-categorias"><thead><tr><th>Categoria</th><th style="text-align:right">Qtd</th></tr></thead><tbody></tbody></table>
                </div>
                <div class="report-section">
                    <h4>📝 Histórico Detalhado</h4>
                    <table class="report-table"><thead><tr><th>Data</th><th>Quarto</th><th>Tipo</th><th>Status</th><th>Duração</th></tr></thead><tbody id="table-audit"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, updateDoc, doc, orderBy, serverTimestamp } 
        from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVgZLMVBJFqnOTKejx2fqs_4YhNWMXa-Y",
            authDomain: "sistema-hoteis-app.firebaseapp.com",
            projectId: "sistema-hoteis-app",
            storageBucket: "sistema-hoteis-app.firebasestorage.app",
            messagingSenderId: "739670257880",
            appId: "1:739670257880:web:29bda59e89de84798427ad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let hotelAtual = ""; 
        let isMaster = false;
        let todosDadosCache = [];

        // TORNA FUNÇÕES GLOBAIS (IMPORTANTE)
        window.switchTab = function(tabName) {
            document.getElementById('view-board').classList.add('hidden');
            document.getElementById('view-reports').classList.add('hidden');
            document.getElementById('btn-tab-board').classList.remove('active');
            document.getElementById('btn-tab-reports').classList.remove('active');

            if(tabName === 'board') {
                document.getElementById('view-board').classList.remove('hidden');
                document.getElementById('btn-tab-board').classList.add('active');
            } else {
                document.getElementById('view-reports').classList.remove('hidden');
                document.getElementById('btn-tab-reports').classList.add('active');
                gerarRelatorios();
            }
        }

        window.atualizarDadosGeral = function() {
            const filtro = document.getElementById('filtro-master-select').value;
            carregarDadosFirestore(filtro);
        }

        window.fazerLogin = function() {
            console.log("Tentando login...");
            const senha = document.getElementById('senhaInput').value;
            if (senha === "master") { isMaster = true; document.getElementById('card-filtro').classList.remove('hidden'); entrarPainel("TODOS"); }
            else if (senha === "hotel1") { entrarPainel("Hit Hotel"); }
            else if (senha === "hotel2") { entrarPainel("Porto Salvador"); }
            else if (senha === "hotel3") { entrarPainel("Porto das Ancoras"); }
            else { alert("Senha incorreta!"); }
        }

        function carregarDadosFirestore(filtro) {
            const containerBoard = document.getElementById('view-board');
            containerBoard.innerHTML = "<p style='width:100%; text-align:center;'>Carregando dados...</p>";

            let q;
            if (filtro === "TODOS") q = query(collection(db, "chamados"));
            else q = query(collection(db, "chamados"), where("hotel", "==", filtro));

            onSnapshot(q, (querySnapshot) => {
                todosDadosCache = [];
                let pendentesRender = [];

                querySnapshot.forEach((doc) => {
                    let d = doc.data();
                    d.id = doc.id;
                    if(d.data) d.dateObj = new Date(d.data.seconds * 1000);
                    if(d.dataResolucao) d.resDateObj = new Date(d.dataResolucao.seconds * 1000);
                    
                    todosDadosCache.push(d);
                    
                    // Se não estiver arquivado, vai pro quadro
                    if (d.status !== 'arquivado') {
                        pendentesRender.push(d);
                    }
                });

                renderizarQuadro(pendentesRender);
                if(!document.getElementById('view-reports').classList.contains('hidden')) {
                    gerarRelatorios();
                }
            });
        }

        function renderizarQuadro(lista) {
            const container = document.getElementById('view-board');
            container.innerHTML = "";
            lista.sort((a, b) => (a.dateObj || 0) - (b.dateObj || 0));

            const grupos = {
                "Fale com a Recepção": [], "Manutenção": [], "Praia": [], "Sunset": [], "Sugestão": [], "Reclamação": []
            };

            let count = 0;
            lista.forEach(item => {
                // FILTRO DO KANBAN:
                // Se resolvido, mostra? SIM, mas verde.
                // Só não mostra se for 'arquivado' (já filtrado antes)
                count++;
                let card = criarCartaoHTML(item);
                let t = item.tipo;
                
                if (t === 'Recepção' || t === 'Serviço') grupos['Fale com a Recepção'].push(card);
                else if (t === 'Manutenção') grupos['Manutenção'].push(card);
                else if (t === 'Praia' || t.includes('Aluguel')) grupos['Praia'].push(card);
                else if (t === 'Sunset' || t.includes('Pôr')) grupos['Sunset'].push(card);
                else if (t === 'Sugestão') grupos['Sugestão'].push(card);
                else if (t === 'Reclamação') grupos['Reclamação'].push(card);
                else grupos['Fale com a Recepção'].push(card);
            });

            if(count === 0) {
                container.innerHTML = "<p style='width:100%; text-align:center; color:#666; margin-top:20px;'>Nenhuma demanda pendente.</p>";
                return;
            }

            for (const [nome, tickets] of Object.entries(grupos)) {
                if (tickets.length > 0) {
                    let col = document.createElement('div');
                    col.className = 'board-column';
                    if(nome === 'Manutenção') col.style.borderTopColor = '#d32f2f';
                    else if(nome.includes('Recepção')) col.style.borderTopColor = '#1976d2';
                    else col.style.borderTopColor = '#fbc02d';

                    col.innerHTML = `<div class="board-header"><span>${nome}</span> <span class="tag-count">${tickets.length}</span></div>${tickets.join('')}`;
                    container.appendChild(col);
                }
            }
        }

        function criarCartaoHTML(chamado) {
            const hora = chamado.dateObj ? chamado.dateObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : '--:--';
            
            let classStatus = 'status-red'; 
            let badgeText = "🔴 PENDENTE";
            let btnHtml = `<button class="btn-start" onclick="mudarStatus('${chamado.id}', 'andamento')">🟡 Assumir</button>`;

            if (chamado.status === 'andamento') {
                classStatus = 'status-yellow';
                badgeText = "🟡 EM TRATAMENTO";
                btnHtml = `<button class="btn-resolve" onclick="mudarStatus('${chamado.id}', 'resolvido')">✅ Resolver</button>`;
            } else if (chamado.status === 'resolvido') {
                classStatus = 'status-green';
                badgeText = "🟢 RESOLVIDO";
                btnHtml = `<button class="btn-archive" onclick="mudarStatus('${chamado.id}', 'arquivado')">📁 Arquivar</button>`;
            }

            return `
            <div class="ticket-card ${classStatus}">
                <div style="font-size:0.7rem; font-weight:bold; margin-bottom:5px; text-align:right;">${badgeText}</div>
                <div class="card-top"><span class="card-time">🕒 ${hora}</span><span class="card-room">Q. ${chamado.quarto}</span></div>
                <span class="card-desc">${chamado.descricao}</span>
                ${chamado.telefone ? `<span class="card-obs">📞 ${chamado.telefone}</span>` : ''}
                ${chamado.dataReserva ? `<span class="card-obs" style="color:#d32f2f">📅 ${chamado.dataReserva}</span>` : ''}
                <div style="margin-top:auto">${btnHtml}</div>
            </div>`;
        }

        window.gerarRelatorios = function() {
            let inicioInput = document.getElementById('rel-inicio').value;
            let fimInput = document.getElementById('rel-fim').value;
            let dataInicio = inicioInput ? new Date(inicioInput) : new Date(); 
            if(!inicioInput) dataInicio.setHours(0,0,0,0);
            let dataFim = fimInput ? new Date(fimInput) : new Date();
            dataFim.setHours(23,59,59,999);

            let dadosFiltrados = todosDadosCache.filter(item => {
                if(!item.dateObj) return false;
                return item.dateObj >= dataInicio && item.dateObj <= dataFim;
            });

            let resolvidos = 0, pendentes = 0, temposTotal = 0, qtdComTempo = 0;
            let categoriasCount = {}, temposPorSetor = {}; 

            dadosFiltrados.forEach(d => {
                if(d.status === 'resolvido' || d.status === 'arquivado') {
                    resolvidos++;
                    if(d.dateObj && d.resDateObj) {
                        let diffMin = (d.resDateObj - d.dateObj) / 1000 / 60; 
                        temposTotal += diffMin;
                        qtdComTempo++;
                        if(!temposPorSetor[d.tipo]) temposPorSetor[d.tipo] = {soma:0, qtd:0};
                        temposPorSetor[d.tipo].soma += diffMin; temposPorSetor[d.tipo].qtd++;
                    }
                } else { pendentes++; }
                if(!categoriasCount[d.tipo]) categoriasCount[d.tipo] = 0;
                categoriasCount[d.tipo]++;
            });

            document.getElementById('kpi-resolvidos').innerText = resolvidos;
            document.getElementById('kpi-pendentes').innerText = pendentes;
            let mediaGeral = qtdComTempo > 0 ? Math.round(temposTotal / qtdComTempo) : 0;
            document.getElementById('kpi-tempo').innerText = mediaGeral + " min";

            let critico = "--", maiorQtd = 0;
            for(let [cat, qtd] of Object.entries(categoriasCount)) { if(qtd > maiorQtd) { maiorQtd = qtd; critico = cat; } }
            document.getElementById('kpi-critico').innerText = critico;

            let tbodyCat = document.querySelector('#table-categorias tbody');
            tbodyCat.innerHTML = "";
            for(let [cat, qtd] of Object.entries(categoriasCount)) {
                tbodyCat.innerHTML += `<tr><td>${cat}</td><td style="text-align:right"><b>${qtd}</b></td></tr>`;
            }

            let tbodyAudit = document.getElementById('table-audit');
            tbodyAudit.innerHTML = "";
            let ultimos = dadosFiltrados.sort((a,b) => b.dateObj - a.dateObj).slice(0, 50);
            ultimos.forEach(d => {
                let duracao = "--";
                if(d.status === 'resolvido' && d.dateObj && d.resDateObj) duracao = Math.round((d.resDateObj - d.dateObj)/1000/60) + " min";
                tbodyAudit.innerHTML += `<tr><td>${d.dateObj?.toLocaleString()}</td><td>${d.quarto}</td><td>${d.tipo}</td><td>${d.status}</td><td>${duracao}</td></tr>`;
            });
        }

        window.mudarStatus = async function(id, novoStatus) {
            const chamadoRef = doc(db, "chamados", id);
            let updateData = { status: novoStatus };
            if(novoStatus === 'resolvido') updateData.dataResolucao = serverTimestamp();
            await updateDoc(chamadoRef, updateData);
        }

        window.entrarPainel = function(hotel) {
            hotelAtual = hotel;
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('tela-admin').classList.remove('hidden');
            if(!isMaster) { document.getElementById('card-filtro').classList.add('hidden'); document.getElementById('titulo-painel').innerText = hotel; } 
            else { document.getElementById('titulo-painel').innerText = "Painel Master"; }
            carregarDadosFirestore(hotel);
        }

        window.mostrarAreaHospede = function(hotel, veioDoQR = false) {
            hotelAtual = hotel;
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('tela-hospede').classList.remove('hidden');
            const logoImg = document.getElementById('logo-hotel-topo');
            if(hotel === 'Hit Hotel') logoImg.src = "logo_hit.png";
            else if(hotel === 'Porto Salvador') logoImg.src = "logo_porto.png";
            else logoImg.src = "logo_ancoras.png";
            
            const optionPraia = document.getElementById('opt-praia');
            const optionSunset = document.getElementById('opt-sunset');
            if(hotel === 'Porto das Ancoras') { optionPraia.hidden = true; optionPraia.disabled = true; optionSunset.hidden = true; optionSunset.disabled = true; } 
            else { optionPraia.hidden = false; optionPraia.disabled = false; optionSunset.hidden = false; optionSunset.disabled = false; }
            if(veioDoQR) document.getElementById('btn-voltar').classList.add('hidden'); else document.getElementById('btn-voltar').classList.remove('hidden');
        }

        // Funções auxiliares (mesmas anteriores)
        window.mudarIdioma = function(lang) { /* ... (igual anterior) ... */ }
        window.verificarOpcao = function() {
            const select = document.getElementById('tipo');
            document.getElementById('area-kit-praia').classList.add('hidden');
            document.getElementById('area-sunset').classList.add('hidden');
            if (select.value === 'Praia') document.getElementById('area-kit-praia').classList.remove('hidden');
            if (select.value === 'Sunset') document.getElementById('area-sunset').classList.remove('hidden');
        }
        window.toggleInput = function(checkId, inputId) {
            let chk = document.getElementById(checkId);
            let inp = document.getElementById(inputId);
            if(chk.checked) { inp.style.display = 'block'; inp.focus(); } else { inp.style.display = 'none'; inp.value=''; }
        }
        window.enviarChamado = async function() {
            const quarto = document.getElementById('quarto').value;
            const telefone = document.getElementById('telefone').value;
            const tipo = document.getElementById('tipo').value;
            let desc = document.getElementById('descricao').value;
            let dataReserva = null;
            if (tipo === 'Praia') {
                let itens = [];
                if(document.getElementById('check-cadeira').checked) itens.push(`Cadeira (${document.getElementById('qtd-cadeira').value||1})`);
                if(document.getElementById('check-toalha').checked) itens.push(`Toalha (${document.getElementById('qtd-toalha').value||1})`);
                if(document.getElementById('check-cooler').checked) itens.push(`Cooler [${document.getElementById('detalhe-cooler').value}]`);
                if(itens.length===0) return alert("Selecione um item.");
                desc = `[ALUGUEL]: ${itens.join(', ')} \nObs: ${desc}`;
            }
            if (tipo === 'Sunset') {
                dataReserva = document.getElementById('data-sunset').value;
                if(!dataReserva) return alert("Escolha a data.");
                const q = query(collection(db, "chamados"), where("tipo", "==", "Sunset"), where("hotel", "==", hotelAtual), where("dataReserva", "==", dataReserva));
                const snap = await getDocs(q);
                if(snap.size >= 5) return alert("Data lotada!");
                desc = `[SUNSET] Data: ${dataReserva} | R$ 120,00 \nObs: ${desc}`;
            }
            if(!quarto || !tipo) return alert("Preencha Quarto e Tipo.");
            try {
                await addDoc(collection(db, "chamados"), {
                    hotel: hotelAtual, quarto, telefone, tipo, descricao: desc, status: 'pendente', dataReserva, data: serverTimestamp()
                });
                alert("Enviado!"); location.reload();
            } catch(e) { alert("Erro"); }
        }

        // Verifica URL
        const params = new URLSearchParams(window.location.search);
        const h = params.get('hotel');
        if(h) { if(h==='hit') mostrarAreaHospede('Hit Hotel', true); else if(h==='porto') mostrarAreaHospede('Porto Salvador', true); else if(h==='ancoras') mostrarAreaHospede('Porto das Ancoras', true); }
    </script>
