<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Service System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILO GERAL --- */
        :root {
            --primary: #0056b3; 
            --bg: #eef2f5; /* Fundo mais escuro para contraste */
            --card-bg: #ffffff;
            --text: #333;
            --danger: #d32f2f; 
            --warning: #f57f17;
            --success: #2e7d32;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 1600px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        
        .app-card { width: 100%; max-width: 500px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; margin-top: 20px; position: relative;}
        .hidden { display: none !important; }
        
        /* --- HEADER E LOGOS --- */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .hotel-identity { display: flex; align-items: center; gap: 15px; text-align: left; }
        .hotel-logo-header { max-height: 60px; width: auto; object-fit: contain; }
        .btn-logo { height: 30px; vertical-align: middle; margin-right: 10px; }

        /* --- IDIOMAS --- */
        .lang-options { display: flex; gap: 10px; font-size: 0.9rem; }
        .lang-btn { cursor: pointer; font-weight: 700; opacity: 0.3; transition: opacity 0.2s; text-decoration: none; color: #333; }
        .lang-btn:hover, .lang-btn.active { opacity: 1; text-decoration: underline; }
        .color-br.active { color: #000; }
        .color-us.active { color: #0056b3; }
        .color-es.active { color: #e74c3c; }

        /* Botões e Inputs */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-bottom: 12px; transition: 0.2s; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .btn-hotel { background: white; border: 2px solid #ccc; color: #444; }
        .btn-hotel:hover { border-color: var(--primary); color: var(--primary); background: #f8fbff; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #00a8cc); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-sm { padding: 8px 15px; width: auto; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #999; border-radius: 8px; background: #fff; box-sizing: border-box; font-family: inherit; font-size: 1rem; color: #000;}
        .input-row { display: flex; gap: 10px; }
        .input-row input { flex: 1; }

        /* --- KIT PRAIA --- */
        .beach-kit-container { background: #e3f2fd; border: 2px solid #90caf9; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; }
        .checkbox-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; height: 40px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; cursor: pointer; width: 150px; font-weight: bold; color: #333; }
        input[type="checkbox"] { transform: scale(1.3); margin: 0; cursor: pointer; }
        .dynamic-input { flex: 1; margin-bottom: 0 !important; padding: 8px !important; height: 38px; display: none; font-size: 0.9rem !important; border: 2px solid var(--primary); }

        /* --- PÔR DO SOL --- */
        .sunset-container { background: #fff3e0; border: 2px solid #ffb74d; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .sunset-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .price-tag { background: #2ecc71; color: white; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; display: inline-block;}
        .time-info { font-size: 0.9rem; color: #666; margin-bottom: 10px; display: block; }

        /* --- DASHBOARD MASTER (QUADRO KANBAN) --- */
        .dashboard-container { width: 100%; margin-top: 10px; padding: 0 10px; }
        
        .board-grid { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            align-items: start; 
            justify-content: center;
            width: 100%;
        }
        
        .board-column { 
            background: #ffffff; 
            padding: 10px; 
            border-radius: 8px; 
            width: 300px; /* Largura fixa para ficar organizado */
            flex-grow: 1;
            max-width: 350px;
            border-top: 5px solid #ccc; /* Cor padrão do topo */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 10px;
            min-height: 150px;
        }
        
        .board-header { 
            font-weight: 900; color: #222; text-transform: uppercase; font-size: 0.85rem; 
            display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #eee;
        }
        
        /* ESTILO DOS CARTÕES (CARDS) - ALTO CONTRASTE */
        .ticket-card { 
            background: white; 
            padding: 12px; 
            border-radius: 6px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.15); 
            text-align: left; 
            border: 1px solid #ddd;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-time { background: #333; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .card-room { font-size: 1.1rem; font-weight: 800; color: #000; background: #e3f2fd; padding: 2px 8px; border-radius: 4px; border: 1px solid #90caf9;}
        
        .card-desc { font-size: 0.95rem; color: #000; font-weight: 600; line-height: 1.3; }
        .card-obs { font-size: 0.85rem; color: #555; font-style: italic; background: #f5f5f5; padding: 4px; border-radius: 4px; }

        /* STATUS VISUAL */
        /* Pendente (Vermelho) */
        .status-red { border-left: 8px solid var(--danger); background-color: #fff8f8; }
        .btn-start { width: 100%; padding: 8px; background: #fff3e0; border: 1px solid #ffcc80; color: #e65100; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-start:hover { background: #ffe0b2; }

        /* Em Andamento (Amarelo) */
        .status-yellow { border-left: 8px solid var(--warning); background-color: #fffdf0; }
        .btn-resolve { width: 100%; padding: 8px; background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-resolve:hover { background: #c8e6c9; }

        .tag-count { background: #000; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
        
        /* Botão Filtro */
        #card-filtro { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="tela-login" class="app-card">
            <div class="header-row">
                <div style="font-size: 2rem;">🏨</div>
                <div class="lang-options">
                    <span onclick="mudarIdioma('pt')" class="lang-btn color-br active">BR</span>
                    <span onclick="mudarIdioma('en')" class="lang-btn color-us">EN</span>
                    <span onclick="mudarIdioma('es')" class="lang-btn color-es">ES</span>
                </div>
            </div>

            <h1 data-key="login_title">Acesso ao Sistema</h1>
            
            <button onclick="mostrarAreaHospede('Hit Hotel')" class="btn btn-hotel">
                <img src="logo_hit.png" alt="Hit Hotel" class="btn-logo"> <b>Hit Hotel</b>
            </button>
            <button onclick="mostrarAreaHospede('Porto Salvador')" class="btn btn-hotel">
                <img src="logo_porto.png" alt="Porto Salvador" class="btn-logo"> <b>Porto Salvador</b>
            </button>
            <button onclick="mostrarAreaHospede('Porto das Ancoras')" class="btn btn-hotel">
                <img src="logo_ancoras.png" alt="Porto das Ancoras" class="btn-logo"> <b>Porto das Âncoras</b>
            </button>

            <div style="border-top: 1px solid #eee; margin: 20px 0;"></div>

            <p data-key="admin_area">Área Administrativa</p>
            <input type="password" id="senhaInput" placeholder="Senha..." data-ph="pass_placeholder">
            <button onclick="fazerLogin()" class="btn btn-primary" data-key="enter_btn">Entrar</button>
        </div>

        <div id="tela-hospede" class="app-card hidden">
            <div class="header-row">
                <div class="hotel-identity">
                    <img id="logo-hotel-topo" src="" alt="Hotel Logo" class="hotel-logo-header">
                </div>
                <div class="lang-options">
                    <span onclick="mudarIdioma('pt')" class="lang-btn color-br active">BR</span>
                    <span onclick="mudarIdioma('en')" class="lang-btn color-us">EN</span>
                    <span onclick="mudarIdioma('es')" class="lang-btn color-es">ES</span>
                </div>
            </div>

            <p id="subtitulo-hospede" data-key="welcome_msg">Bem-vindo! Como podemos ajudar?</p>

            <div class="input-row">
                <input type="text" id="quarto" placeholder="Nº do Quarto *" data-ph="room_placeholder" required>
                <input type="text" id="telefone" placeholder="Telefone (Opcional)" data-ph="phone_placeholder">
            </div>
            
            <select id="tipo" onchange="verificarOpcao()">
                <option value="" disabled selected data-key="select_default">Selecione o que precisa...</option>
                <option value="Recepção" data-key="opt_service">🗣️ Fale com a Recepção</option>
                <option value="Manutenção" data-key="opt_maint">🛠️ Manutenção</option>
                <option value="Praia" id="opt-praia" data-key="opt_beach">🏖️ Aluguel Cadeira, Toalha, Cooler</option>
                <option value="Sunset" id="opt-sunset" data-key="opt_sunset">🥂 Pôr do Sol com Espumante</option>
                <option value="Sugestão" data-key="opt_idea">💡 Sugestão / Elogio</option>
                <option value="Reclamação" data-key="opt_complain">📢 Reclamação</option>
            </select>

            <div id="area-kit-praia" class="beach-kit-container hidden">
                <strong style="color:#0056b3; display:block; margin-bottom:10px;" data-key="beach_select_items">Selecione os itens:</strong>
                <div class="checkbox-row">
                    <label class="checkbox-label"><input type="checkbox" id="check-cadeira" onchange="toggleInput('check-cadeira', 'qtd-cadeira')"> <span data-key="beach_chair">Cadeira</span></label>
                    <input type="number" id="qtd-cadeira" class="dynamic-input" min="1" placeholder="Qtd">
                </div>
                <div class="checkbox-row">
                    <label class="checkbox-label"><input type="checkbox" id="check-toalha" onchange="toggleInput('check-toalha', 'qtd-toalha')"> <span data-key="beach_towel">Toalha</span></label>
                    <input type="number" id="qtd-toalha" class="dynamic-input" min="1" placeholder="Qtd">
                </div>
                <div class="checkbox-row">
                    <label class="checkbox-label"><input type="checkbox" id="check-cooler" onchange="toggleInput('check-cooler', 'detalhe-cooler')"> <span data-key="beach_cooler">Cooler</span></label>
                    <input type="text" id="detalhe-cooler" class="dynamic-input" placeholder="O que deseja?">
                </div>
            </div>

            <div id="area-sunset" class="sunset-container hidden">
                <img src="img/por do sol.jpg" class="sunset-img" alt="Pôr do Sol">
                <h3 style="margin:5px 0;">Pôr do Sol com Espumante</h3>
                <span class="price-tag">R$ 120,00</span>
                <span class="time-info">⏰ 16:30 - 18:30</span>
                <label style="display:block; margin-top:10px; font-weight:bold;">Escolha a Data:</label>
                <input type="date" id="data-sunset" style="margin-top:5px;">
            </div>

            <textarea id="descricao" rows="4" placeholder="Descreva o pedido..." data-ph="desc_placeholder"></textarea>
            
            <button onclick="enviarChamado()" class="btn btn-success" data-key="send_btn">Enviar Solicitação</button>
            <button id="btn-voltar" onclick="location.href = window.location.pathname" class="btn btn-hotel hidden" data-key="back_btn">Voltar</button>
        </div>

        <div id="tela-admin" class="hidden dashboard-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="titulo-painel" style="margin:0; font-size:1.5rem;">Painel de Controle</h3>
                <button onclick="location.href = window.location.pathname" class="btn btn-sm btn-hotel">Sair</button>
            </div>

            <div id="card-filtro">
                <label style="font-weight: bold;">📊 Visualizar:</label>
                <select id="filtro-master-select" onchange="alterarFiltroMaster()" style="width: 100%; margin-top:5px; border: 2px solid var(--primary);">
                    <option value="TODOS">🏢 Todos os 3 Hotéis</option>
                    <option value="Hit Hotel">🌊 Hit Hotel</option>
                    <option value="Porto Salvador">⚓ Porto Salvador</option>
                    <option value="Porto das Ancoras">⛵ Porto das Âncoras</option>
                </select>
            </div>

            <div class="board-grid" id="quadro-demandas">
                <p style="width:100%; text-align:center;">Carregando...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, updateDoc, doc, orderBy, serverTimestamp, getDocs } 
        from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVgZLMVBJFqnOTKejx2fqs_4YhNWMXa-Y",
            authDomain: "sistema-hoteis-app.firebaseapp.com",
            projectId: "sistema-hoteis-app",
            storageBucket: "sistema-hoteis-app.firebasestorage.app",
            messagingSenderId: "739670257880",
            appId: "1:739670257880:web:29bda59e89de84798427ad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let hotelAtual = ""; 
        let isMaster = false;
        
        // TRADUÇÕES E IDIOMAS (MANTIDOS)
        const translations = {
            pt: { login_title: "Acesso ao Sistema", guest: "Hóspede", admin_area: "Área Administrativa", pass_placeholder: "Senha...", enter_btn: "Entrar", welcome_msg: "Bem-vindo! Como podemos ajudar?", room_placeholder: "Nº do Quarto *", phone_placeholder: "Telefone (Opcional)", select_default: "Selecione o que precisa...", opt_beach: "🏖️ Aluguel Cadeira, Toalha, Cooler", opt_sunset: "🥂 Pôr do Sol com Espumante", opt_service: "🗣️ Fale com a Recepção", opt_maint: "🛠️ Manutenção", opt_idea: "💡 Sugestão / Elogio", opt_complain: "📢 Reclamação", desc_placeholder: "Alguma observação extra?", send_btn: "Enviar Solicitação", back_btn: "Voltar", beach_select_items: "Selecione os itens:", beach_chair: "Cadeira", beach_cooler: "Cooler", beach_towel: "Toalha" },
            en: { login_title: "System Access", guest: "Guest", admin_area: "Staff Area", pass_placeholder: "Password...", enter_btn: "Login", welcome_msg: "Welcome! How can we help?", room_placeholder: "Room Number *", phone_placeholder: "Phone (Optional)", select_default: "Select what you need...", opt_beach: "🏖️ Rent Beach Chair, Towel, Cooler", opt_sunset: "🥂 Sunset with Sparkling Wine", opt_service: "🗣️ Talk to Reception", opt_maint: "🛠️ Maintenance", opt_idea: "💡 Suggestion / Compliment", opt_complain: "📢 Complaint", desc_placeholder: "Any extra comments?", send_btn: "Send Request", back_btn: "Back", beach_select_items: "Select items:", beach_chair: "Beach Chair", beach_cooler: "Cooler", beach_towel: "Beach Towel" },
            es: { login_title: "Acceso al Sistema", guest: "Huésped", admin_area: "Área Administrativa", pass_placeholder: "Contraseña...", enter_btn: "Entrar", welcome_msg: "¡Bienvenido! ¿Cómo podemos ayudar?", room_placeholder: "Número de Habitación *", phone_placeholder: "Teléfono (Opcional)", select_default: "Seleccione lo que necesita...", opt_beach: "🏖️ Alquiler Silla, Toalla, Hielera", opt_sunset: "🥂 Puesta de Sol con Espumoso", opt_service: "🗣️ Hable con Recepción", opt_maint: "🛠️ Mantenimiento", opt_idea: "💡 Sugerencia / Elogio", opt_complain: "📢 Queja", desc_placeholder: "¿Alguna observación extra?", send_btn: "Enviar Solicitud", back_btn: "Volver", beach_select_items: "Seleccione los artículos:", beach_chair: "Silla de Playa", beach_cooler: "Hielera / Cooler", beach_towel: "Toalla de Playa" }
        };

        window.mudarIdioma = function(lang) {
            document.querySelectorAll('.lang-btn').forEach(el => el.classList.remove('active'));
            const seletores = { 'pt': '.color-br', 'en': '.color-us', 'es': '.color-es' };
            document.querySelectorAll(seletores[lang]).forEach(el => el.classList.add('active'));
            document.querySelectorAll('[data-key]').forEach(elem => {
                const key = elem.getAttribute('data-key');
                if(translations[lang][key]) elem.innerText = translations[lang][key];
            });
            document.querySelectorAll('[data-ph]').forEach(elem => {
                const key = elem.getAttribute('data-ph');
                if(translations[lang][key]) elem.placeholder = translations[lang][key];
            });
        }

        // --- SISTEMA DE LOGIN E NAVEGAÇÃO ---
        window.fazerLogin = function() {
            const senha = document.getElementById('senhaInput').value;
            if (senha === "master") { isMaster = true; document.getElementById('card-filtro').classList.remove('hidden'); entrarPainel("TODOS"); }
            else if (senha === "hotel1") { entrarPainel("Hit Hotel"); }
            else if (senha === "hotel2") { entrarPainel("Porto Salvador"); }
            else if (senha === "hotel3") { entrarPainel("Porto das Ancoras"); }
            else { alert("Senha inválida!"); }
        }

        window.mostrarAreaHospede = function(hotel, veioDoQR = false) {
            hotelAtual = hotel;
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('tela-hospede').classList.remove('hidden');
            
            const logoImg = document.getElementById('logo-hotel-topo');
            if(hotel === 'Hit Hotel') logoImg.src = "logo_hit.png";
            else if(hotel === 'Porto Salvador') logoImg.src = "logo_porto.png";
            else logoImg.src = "logo_ancoras.png";

            const optionPraia = document.getElementById('opt-praia');
            const optionSunset = document.getElementById('opt-sunset');
            if(hotel === 'Porto das Ancoras') { optionPraia.hidden = true; optionPraia.disabled = true; optionSunset.hidden = true; optionSunset.disabled = true; } 
            else { optionPraia.hidden = false; optionPraia.disabled = false; optionSunset.hidden = false; optionSunset.disabled = false; }

            if(veioDoQR) document.getElementById('btn-voltar').classList.add('hidden'); 
            else document.getElementById('btn-voltar').classList.remove('hidden');
        }

        window.verificarOpcao = function() {
            const select = document.getElementById('tipo');
            document.getElementById('area-kit-praia').classList.add('hidden');
            document.getElementById('area-sunset').classList.add('hidden');
            if (select.value === 'Praia') document.getElementById('area-kit-praia').classList.remove('hidden');
            else if (select.value === 'Sunset') document.getElementById('area-sunset').classList.remove('hidden');
        }

        window.toggleInput = function(checkboxId, inputId) {
            const checkbox = document.getElementById(checkboxId);
            const input = document.getElementById(inputId);
            if (checkbox.checked) { input.style.display = 'block'; input.focus(); } 
            else { input.style.display = 'none'; input.value = ''; }
        }

        window.entrarPainel = function(hotel) {
            hotelAtual = hotel;
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('tela-admin').classList.remove('hidden');
            if(!isMaster) { document.getElementById('card-filtro').classList.add('hidden'); document.getElementById('titulo-painel').innerText = hotel; } 
            else { document.getElementById('titulo-painel').innerText = "Painel Master"; }
            carregarDados(hotel);
        }

        window.alterarFiltroMaster = function() {
            const novoFiltro = document.getElementById('filtro-master-select').value;
            carregarDados(novoFiltro);
        }

        // --- QUADRO KANBAN DINÂMICO (CORRIGIDO) ---
        function carregarDados(filtro) {
            const containerBoard = document.getElementById('quadro-demandas');
            containerBoard.innerHTML = "<p style='width:100%; text-align:center;'>Carregando...</p>";

            let q;
            if (filtro === "TODOS") q = query(collection(db, "chamados"));
            else q = query(collection(db, "chamados"), where("hotel", "==", filtro));

            onSnapshot(q, (querySnapshot) => {
                containerBoard.innerHTML = "";
                
                // Mapeamento Inteligente: Agrupa nomes antigos e novos
                const grupos = {
                    "Recepção": [], "Manutenção": [], "Praia": [], "Sunset": [], "Sugestão": [], "Reclamação": []
                };

                let listaDocs = [];
                querySnapshot.forEach((doc) => {
                    listaDocs.push({ id: doc.id, ...doc.data() });
                });

                // Ordena: Mais antigo primeiro
                listaDocs.sort((a, b) => (a.data?.seconds || 0) - (b.data?.seconds || 0));

                let totalItens = 0;

                listaDocs.forEach(chamado => {
                    if (chamado.status === 'resolvido') return; // Não mostra resolvidos

                    const cardHtml = criarCartaoHTML(chamado);
                    totalItens++;
                    
                    // Lógica de Agrupamento "À prova de falhas" (Pega nomes antigos e novos)
                    const tipo = chamado.tipo;
                    if (tipo === 'Recepção' || tipo === 'Serviço') grupos['Recepção'].push(cardHtml);
                    else if (tipo === 'Manutenção') grupos['Manutenção'].push(cardHtml);
                    else if (tipo === 'Praia' || tipo.includes('Aluguel')) grupos['Praia'].push(cardHtml);
                    else if (tipo === 'Sunset' || tipo.includes('Pôr do Sol')) grupos['Sunset'].push(cardHtml);
                    else if (tipo === 'Sugestão') grupos['Sugestão'].push(cardHtml);
                    else if (tipo === 'Reclamação') grupos['Reclamação'].push(cardHtml);
                    else grupos['Recepção'].push(cardHtml); // Joga perdidos na recepção
                });

                if(totalItens === 0) {
                    containerBoard.innerHTML = "<p style='width:100%; text-align:center; color:#666; margin-top:20px;'>Nenhuma demanda pendente.</p>";
                    return;
                }

                // Renderiza APENAS colunas com conteúdo
                for (const [nome, tickets] of Object.entries(grupos)) {
                    if (tickets.length > 0) {
                        const colDiv = document.createElement('div');
                        colDiv.className = 'board-column';
                        // Cor da borda do topo baseada no tipo
                        if(nome === 'Manutenção') colDiv.style.borderTopColor = '#d32f2f';
                        else if(nome === 'Recepção') colDiv.style.borderTopColor = '#1976d2';
                        else colDiv.style.borderTopColor = '#fbc02d';

                        colDiv.innerHTML = `
                            <div class="board-header">
                                <span>${nome}</span> 
                                <span class="tag-count">${tickets.length}</span>
                            </div>
                            ${tickets.join('')} 
                        `;
                        containerBoard.appendChild(colDiv);
                    }
                }
            });
        }

        function criarCartaoHTML(chamado) {
            const dataChamado = chamado.data ? new Date(chamado.data.seconds * 1000) : new Date();
            const hora = dataChamado.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            
            // Status Visual
            let classStatus = 'status-red';
            let btnHtml = `<button class="btn-start" onclick="mudarStatus('${chamado.id}', 'andamento')">🟡 Assumir</button>`;

            if (chamado.status === 'andamento') {
                classStatus = 'status-yellow';
                btnHtml = `<button class="btn-resolve" onclick="mudarStatus('${chamado.id}', 'resolvido')">✅ Resolver</button>`;
            }

            return `
            <div class="ticket-card ${classStatus}">
                <div class="card-top">
                    <span class="card-time">🕒 ${hora}</span>
                    <span class="card-room">Quarto ${chamado.quarto}</span>
                </div>
                <div class="card-desc">${chamado.descricao}</div>
                ${chamado.telefone ? `<div class="card-obs">📞 ${chamado.telefone}</div>` : ''}
                ${chamado.dataReserva ? `<div class="card-obs" style="color:#d32f2f; font-weight:bold;">📅 ${chamado.dataReserva}</div>` : ''}
                <div style="margin-top:10px;">${btnHtml}</div>
            </div>`;
        }

        // --- ENVIAR ---
        window.enviarChamado = async function() {
            const quarto = document.getElementById('quarto').value;
            const telefone = document.getElementById('telefone').value;
            const tipo = document.getElementById('tipo').value;
            let desc = document.getElementById('descricao').value;
            let dataReserva = null;

            if (tipo === 'Praia') {
                let itens = [];
                if(document.getElementById('check-cadeira').checked) itens.push(`Cadeira (${document.getElementById('qtd-cadeira').value||1})`);
                if(document.getElementById('check-toalha').checked) itens.push(`Toalha (${document.getElementById('qtd-toalha').value||1})`);
                if(document.getElementById('check-cooler').checked) itens.push(`Cooler [${document.getElementById('detalhe-cooler').value}]`);
                
                if (itens.length === 0) return alert("Selecione um item.");
                desc = `[ALUGUEL]: ${itens.join(', ')} \nObs: ${desc}`;
            }

            if (tipo === 'Sunset') {
                dataReserva = document.getElementById('data-sunset').value;
                if(!dataReserva) return alert("Escolha a data.");
                // Verifica 5 vagas
                const q = query(collection(db, "chamados"), where("tipo", "==", "Sunset"), where("hotel", "==", hotelAtual), where("dataReserva", "==", dataReserva));
                const snap = await getDocs(q);
                if(snap.size >= 5) return alert("Data lotada!");
                desc = `[SUNSET] Data: ${dataReserva} | R$ 120,00 \nObs: ${desc}`;
            }

            if(!quarto || !tipo) return alert("Preencha Quarto e Tipo.");

            try {
                const btn = document.querySelector('.btn-success');
                btn.disabled = true; btn.innerText = "Enviando...";
                await addDoc(collection(db, "chamados"), {
                    hotel: hotelAtual, quarto: quarto, telefone: telefone, tipo: tipo, descricao: desc, 
                    status: "pendente", dataReserva: dataReserva, data: serverTimestamp()
                });
                alert("Enviado!"); location.reload();
            } catch (e) { alert("Erro."); btn.disabled = false; }
        }

        window.mudarStatus = async function(id, novoStatus) {
            const chamadoRef = doc(db, "chamados", id);
            await updateDoc(chamadoRef, { status: novoStatus, dataResolucao: serverTimestamp() });
        }

        // --- VERIFICAÇÃO URL ---
        function verificarRedirecionamento() {
            const params = new URLSearchParams(window.location.search);
            const hotelParam = params.get('hotel');
            if (hotelParam) {
                if(hotelParam === 'hit') mostrarAreaHospede('Hit Hotel', true);
                else if(hotelParam === 'porto') mostrarAreaHospede('Porto Salvador', true);
                else if(hotelParam === 'ancoras') mostrarAreaHospede('Porto das Ancoras', true);
            }
        }
        verificarRedirecionamento();
    </script>
</body>
